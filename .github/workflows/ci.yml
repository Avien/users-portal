name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-angular:
    name: Validate Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-angular-${{ runner.os }}-

      - run: npm run validate:angular

  validate-react:
    name: Validate React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-react-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-react-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-react-${{ runner.os }}-

      - run: npm run validate:react

  validate-vue:
    name: Validate Vue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-vue-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-vue-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-vue-${{ runner.os }}-

      - run: npm run validate:vue

  validate-business-agent:
    name: Validate Business Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pure vitest, no Nx projects involved (these are root-level tools/*.ts
      # and api/*.ts files, not Nx-tagged libs) — no Nx computation cache step
      # needed here, unlike the three jobs above.
      - run: npm run validate:business-agent